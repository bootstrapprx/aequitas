services:
  nginx-proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - aequitas-dev-net

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://nginx-proxy:80
    depends_on:
      - nginx-proxy
    networks:
      - aequitas-dev-net

networks:
  aequitas-dev-net:
    external: true
    # This network MUST already exist (created by docker-compose.dev.yml)
