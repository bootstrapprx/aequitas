

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: aequitas-postgres-dev
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aequitas_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - aequitas-dev-net

  ollama:
    image: ollama/ollama
    container_name: aequitas-ollama-dev
    ports:
      - "11435:11434"
    volumes:
      - ollama_data_dev:/root/.ollama
    networks:
      - aequitas-dev-net
    # This is a workaround to pull the model on startup.
    # It starts a temporary container that pulls the model, and then the main service starts.
    command: serve

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aequitas-backend-dev
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/aequitas_dev
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - postgres
      - ollama
    networks:
      - aequitas-dev-net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: aequitas-frontend-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
    networks:
      - aequitas-dev-net

volumes:
  postgres_data_dev:
    driver: local
  ollama_data_dev:
    driver: local

networks:
  aequitas-dev-net:
    driver: bridge
